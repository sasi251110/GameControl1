name: GameControl Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Extract, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Automatically extract GameControl ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="GameControl-phase3-4-5.zip"

          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "::error::ZIP file not found at repository root: $ZIP_FILE"
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted
          echo "ZIP extraction completed."
          find extracted -maxdepth 3 -type f | sort | head -200

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Android Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "./settings.gradle" || -f "./settings.gradle.kts" ]]; then
            echo "project_dir=." >> "$GITHUB_OUTPUT"
          elif [[ -f "./extracted/settings.gradle" || -f "./extracted/settings.gradle.kts" ]]; then
            echo "project_dir=extracted" >> "$GITHUB_OUTPUT"
          else
            SETTINGS_FILE="$(find extracted -maxdepth 5 \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit || true)"
            if [[ -z "$SETTINGS_FILE" ]]; then
              echo "::error::No settings.gradle or settings.gradle.kts found in repository or extracted ZIP."
              exit 1
            fi
            echo "project_dir=$(dirname "$SETTINGS_FILE")" >> "$GITHUB_OUTPUT"
          fi
          echo "Selected project directory:"
          cat "$GITHUB_OUTPUT"

      - name: Run Android lint
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"
          gradle lintDebug --stacktrace

      - name: Run unit tests
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"
          gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          cd "${{ steps.project.outputs.project_dir }}"
          gradle assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gamecontrol-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            extracted/**/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish GitHub release for version tag
        if: success() && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"
          mkdir -p dist
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
            "dist/GameControl-${GITHUB_REF_NAME}.apk"
          gh release create "${GITHUB_REF_NAME}" dist/*.apk \
            --title "GameControl ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
