
name: GameControl Android CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: GameControl Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Initialize build logs
      - name: Initialize build log
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build-logs"

          {
            echo "GameControl Android CI"
            echo "Commit: $GITHUB_SHA"
            echo "Ref: $GITHUB_REF"
            echo "Started: $(date -u)"
          } > "$GITHUB_WORKSPACE/build-logs/build.log"

      # 3. Extract ZIP if available
      - name: Extract GameControl ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="GameControl-phase3-4-5.zip"

          if [ -f "$ZIP_FILE" ]; then
            mkdir -p extracted
            unzip -o "$ZIP_FILE" -d extracted

            echo "ZIP extraction completed" \
              | tee -a "$GITHUB_WORKSPACE/build-logs/build.log"
          else
            echo "ZIP not found. Using repository project." \
              | tee -a "$GITHUB_WORKSPACE/build-logs/build.log"
          fi

      # 4. Setup Java
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 5. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 6. Locate Android project
      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$GITHUB_WORKSPACE/settings.gradle" ] || \
             [ -f "$GITHUB_WORKSPACE/settings.gradle.kts" ]; then

            PROJECT_DIR="$GITHUB_WORKSPACE"

          else
            SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/extracted" \
              -maxdepth 6 \
              \( -name settings.gradle \
              -o -name settings.gradle.kts \) \
              -print -quit 2>/dev/null || true)"

            if [ -z "$SETTINGS_FILE" ]; then
              echo "::error::Android Gradle project not found"
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Project directory: $PROJECT_DIR"

      # 7. Android lint
      - name: Run Android Lint
        shell: bash
        run: |
          set -o pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          gradle lintDebug --stacktrace 2>&1 \
            | tee -a "$GITHUB_WORKSPACE/build-logs/build.log"

      # 8. Unit tests
      - name: Run Unit Tests
        shell: bash
        run: |
          set -o pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          gradle testDebugUnitTest --stacktrace 2>&1 \
            | tee -a "$GITHUB_WORKSPACE/build-logs/build.log"

      # 9. Build APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          cd "${{ steps.project.outputs.project_dir }}"

          gradle assembleDebug --stacktrace --info 2>&1 \
            | tee -a "$GITHUB_WORKSPACE/build-logs/build.log"

      # 10. Verify APK
      - name: Verify APK
        if: success()
        shell: bash
        run: |
          APK="${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK was not generated"
            exit 1
          fi

          ls -lh "$APK"

      # 11. Upload APK
      - name: Upload GameControl APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GameControl-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # 12. Upload build logs
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GameControl-build-log
          path: build-logs/build.log
          if-no-files-found: warn
          retention-days: 14

      # 13. Upload lint report
      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GameControl-lint-report
          path: ${{ steps.project.outputs.project_dir }}/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

      # 14. Publish release
      - name: Publish GitHub Release
        if: success() && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          mkdir -p dist

          cp "$APK" "dist/GameControl-${GITHUB_REF_NAME}.apk"

          gh release create "${GITHUB_REF_NAME}" dist/*.apk \
            --title "GameControl ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
