name: Android CI and Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unzip, bootstrap Gradle, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # If the project is not extracted yet, unzip the archive stored at
      # archive/GameControl-project.zip into the repository root.
      - name: Unzip project archive automatically
        shell: bash
        run: |
          ARCHIVE="archive/GameControl-project.zip"
          if [ -f settings.gradle.kts ]; then
            echo "Project already extracted. Skipping unzip."
          elif [ -f "$ARCHIVE" ]; then
            echo "Extracting $ARCHIVE into the repository root..."
            unzip -q -o "$ARCHIVE" -d .
          else
            echo "::error::Neither settings.gradle.kts nor $ARCHIVE was found."
            exit 1
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Installs Gradle 8.9 so the wrapper can be generated if it is missing.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle wrapper if missing
        if: hashFiles('gradle/wrapper/gradle-wrapper.jar') == ''
        shell: bash
        run: gradle wrapper --gradle-version 8.9

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gamecontrol-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14

      # Runs only for version tags such as v0.1.0.
      - name: Publish GitHub release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/GameControl-${GITHUB_REF_NAME}.apk"
          gh release create "${GITHUB_REF_NAME}" dist/*.apk \
            --title "GameControl ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
